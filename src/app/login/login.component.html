<div class="login-container">
  <div class="login-box">
    <h2>Welcome Back 👋</h2>
    <p class="subtitle">Login to continue to your account</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="input-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <!-- Password -->
      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <!-- Error Message -->
      <p *ngIf="errorMessage" class="error-text">{{ errorMessage }}</p>

      <!-- Submit Button -->
      <button type="submit" [disabled]="loading">
        {{ loading ? "Logging in..." : "Login" }}
      </button>

      <!-- Signup Link -->
      <p class="signup-text">
        Don’t have an account?
        <a routerLink="/signup">Create one</a>
      </p>
    </form>
  </div>
</div>

<!-- ✅ Toast Notification Top-right -->
<div
  *ngIf="showToast"
  class="toast-message show"
  [ngClass]="{
    success: toastType === 'success',
    error: toastType === 'error'
  }"
  role="alert"
>
  <div class="d-flex align-items-center justify-content-between">
    <div>
      <i
        class="bi"
        [ngClass]="{
          'bi-check-circle-fill me-2': toastType === 'success',
          'bi-exclamation-triangle-fill me-2': toastType === 'error'
        }"
      ></i>
      {{ toastMessage }}
    </div>
    <button
      type="button"
      class="btn-close btn-close-white ms-3"
      (click)="showToast = false"
    ></button>
  </div>
</div>
