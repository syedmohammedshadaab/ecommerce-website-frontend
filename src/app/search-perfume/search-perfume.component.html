<div class="container mt-5 perfume-container">
  <h2 class="text-center mb-5 fw-bold text-gradient">Search Perfumes</h2>

  <!-- 🔹 Search Filters -->
  <div
    class="d-flex flex-wrap justify-content-center align-items-center gap-3 mb-5 p-3 bg-light rounded-4 shadow-sm"
  >
    <!-- Name Search -->
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-search text-primary fs-5"></i>
      <input
        type="text"
        class="form-control border-primary shadow-sm"
        placeholder="Search by name"
        [(ngModel)]="searchName"
        (input)="applyFilters()"
        style="width: 220px"
      />
    </div>

    <!-- Gender Filter -->
    <div>
      <select
        class="form-select border-primary shadow-sm"
        [(ngModel)]="searchGender"
        (change)="applyFilters()"
      >
        <option value="">All Genders</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="unisex">Unisex</option>
      </select>
    </div>

    <!-- Price Filter -->
    <div>
      <select
        class="form-select border-success shadow-sm"
        [(ngModel)]="selectedPriceRange"
        (change)="applyFilters()"
      >
        <option value="">All Prices</option>
        <option value="100-500">₹100 - ₹500</option>
        <option value="500-1000">₹500 - ₹1000</option>
        <option value="1000-5000">₹1000 - ₹5000</option>
        <option value="5000-10000">₹5000 - ₹10000</option>
      </select>
    </div>
  </div>

  <!-- 🔹 Perfume Cards -->
  <div class="row justify-content-center">
    <div class="col-md-4 mb-4" *ngFor="let p of filteredPerfumes">
      <div
        class="card perfume-card shadow-sm h-100 border-0 rounded-4 overflow-hidden position-relative"
      >
        <!-- 🌟 New Launch Badge -->
        <span
          *ngIf="p.latestLaunch"
          class="badge bg-danger new-launch-badge position-absolute top-0 end-0 m-2 px-3 py-2 rounded-pill shadow-sm"
        >
          🌟 New Launch
        </span>

        <div class="position-relative overflow-hidden">
          <img
            [src]="
              p.imageUrl ||
              p.imageurl ||
              'https://placehold.co/300x200?text=No+Image'
            "
            class="card-img-top perfume-img"
            alt="{{ p.name }}"
          />
        </div>

        <div class="card-body text-center p-4">
          <h5 class="card-title fw-semibold mb-2">{{ p.name }}</h5>
          <p class="card-text text-muted small mb-3">{{ p.description }}</p>

          <div
            class="d-flex justify-content-center align-items-center mb-2 text-secondary"
          >
            <i class="bi bi-gender-ambiguous me-1"></i>
            <strong>{{ p.gender }}</strong>
          </div>

          <p class="card-text fw-bold mb-3 text-theme-price">
            <i class="bi bi-cash-stack me-1"></i>
            {{ p.price | currency : "INR" }}
          </p>

          <div class="d-flex justify-content-center gap-2">
            <button
              class="btn btn-outline-primary btn-sm d-flex align-items-center"
              (click)="addToCart(p)"
            >
              <i class="bi bi-cart-plus me-1"></i> Add to Cart
            </button>
            <!-- <button
              class="btn btn-outline-secondary btn-sm d-flex align-items-center"
            >
              <i class="bi bi-eye me-1"></i> View
            </button> -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 🔹 Empty Message -->
  <div *ngIf="filteredPerfumes.length === 0" class="text-center mt-5">
    <h5>No perfumes found 😢</h5>
    <p class="text-muted">Try changing your search filters.</p>
  </div>

  <!-- 🔹 Toast -->
  <div
    class="toast-container"
    [ngClass]="{
      show: showToast,
      success: toastType === 'success',
      error: toastType === 'error'
    }"
  >
    {{ toastMessage }}
  </div>
</div>
